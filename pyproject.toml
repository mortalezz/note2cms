[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "note2cms"
version = "0.2.0"
description = "Past-Browser Publishing Protocol"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi[standard]>=0.115.0",
    "python-frontmatter>=1.1.0",
    "python-slugify>=8.0.0",
    "aiosqlite>=0.20.0",
    "Jinja2>=3.1.0",
    "Markdown>=3.7",
    "psycopg[binary]>=3.1.0",
    "psycopg-pool>=3.1.0",
    "httpx>=0.27.0",
    "markdownify>=1.0.0",
]

[tool.setuptools]
packages = ["api", "pipeline"]

[tool.fastapi]
entrypoint = "api.main:app"
